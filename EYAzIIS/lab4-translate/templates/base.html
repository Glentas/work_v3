<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Автоматический машинный перевод текстов{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'>П</text></svg>">
</head>
<body>
{% set path = request.url.path %}

<header class="navbar">
    <div class="container nav-inner">
        <a class="brand" href="/">
            <span class="brand-mark">П</span>
            Машинный перевод текстов
        </a>
        <nav class="nav-links">
            <a href="/" class="{{ 'active' if path == '/' }}">Перевод</a>
            <a href="/history" class="{{ 'active' if path == '/history' }}">История</a>
            <a href="/dictionary" class="{{ 'active' if path == '/dictionary' }}">Словарь</a>
            <a href="/help" class="{{ 'active' if path == '/help' }}">Справка</a>
        </nav>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <span>{{ app_variant }}</span>
        <span class="spacer"></span>
        <a href="/help">Справка</a>
    </div>
</footer>

{% block scripts %}{% endblock %}
<script src="/static/app.js" defer></script>
</body>
</html>
