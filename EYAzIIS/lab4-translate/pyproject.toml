[project]
name = "lab4-translate"
version = "1.0.0"
description = "Автоматический машинный перевод текстов: словарная система с трансфером (вариант 7: англо-русский, медицина и критика изобразительного искусства)"
readme = "README.md"
authors = [
    { name = "G" }
]

requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
