[project]
name = "lab2-detect"
version = "1.0.0"
description = "Автоматическое распознавание языка текста: методы N-грамм, алфавитный и нейросетевой (вариант 7: французский/английский, HTML)"
readme = "README.md"
authors = [
    { name = "G" }
]
# fasttext-predict публикует колёса только до cp313 включительно,
# поэтому проект держит Python 3.13 (см. .python-version).
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
    "beautifulsoup4>=4.12",
    "fasttext-predict>=0.9.2.4",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
