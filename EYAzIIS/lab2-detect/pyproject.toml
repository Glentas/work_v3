[project]
name = "lab1-detect"
version = "1.0.0"
description = "Распознавание языка текста"
readme = "README.md"
authors = [
    { name = "G" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
