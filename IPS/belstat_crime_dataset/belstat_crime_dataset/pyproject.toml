[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belstat-dataset"
version = "1.0.0"
description = "Сбор агрегированной официальной статистики правонарушений с портала открытых данных Белстата (dataportal.belstat.gov.by)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28,<3",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
belstat-dataset = "belstat_dataset.cli:main"

[tool.setuptools]
packages = ["belstat_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
